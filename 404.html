<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uğra</title>
<script src="/ugra/config.js?v=3"></script>
<script>
  // GitHub Pages has no server routes. Two kinds of addresses come here:
  //   /ugra/r/berber-adi   -> the booking page
  //   /ugra/m/ABC123       -> a table QR card: on to the Uğra server's page for that table (config.js says where the
  //                           server is today, so printed cards keep working when it moves)
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var table = parts.indexOf("m");
    if (table >= 0 && /^[A-Za-z0-9]{6}$/.test(parts[table + 1] || "")) {
      var api = ((window.UGRA && window.UGRA.api) || "").replace(/\/+$/, "");
      if (api) location.replace(api + "/m/" + parts[table + 1].toUpperCase());
      return;
    }

    var at = parts.indexOf("r");
    if (at >= 0 && parts[at + 1]) {
      var base = "/" + parts.slice(0, at).join("/") + (at ? "/" : "");
      location.replace(base + "r/?s=" + encodeURIComponent(decodeURIComponent(parts[at + 1])) + location.hash);
    }
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<h1>Sayfa bulunamadı</h1>
<p>Bağlantı yanlış ya da eski olabilir. <a href="/ugra/">Uğra ana sayfası</a></p>
</body>
</html>
